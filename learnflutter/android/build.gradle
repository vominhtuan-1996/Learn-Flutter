allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://storage.googleapis.com/download.flutter.io' }
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}

// Inject namespace for legacy plugins that don't declare one (required by AGP 8+).
// Must be registered BEFORE evaluationDependsOn(":app") below, otherwise the
// subproject is already evaluated when afterEvaluate fires.
subprojects {
    afterEvaluate { project ->
        if (project.hasProperty("android")) {
            def androidExt = project.extensions.findByName("android")
            if (androidExt != null) {
                // Inject namespace for legacy plugins that don't declare one (required by AGP 8+).
                if (androidExt.namespace == null) {
                    def manifestFile = project.file("src/main/AndroidManifest.xml")
                    if (manifestFile.exists()) {
                        def matcher = manifestFile.text =~ /package\s*=\s*"([^"]+)"/
                        if (matcher.find()) {
                            androidExt.namespace = matcher.group(1)
                        }
                    }
                }

                // Align Java + Kotlin JVM target to 17 across all plugins
                // (fix: "Inconsistent JVM-target compatibility" on JDK 21).
                androidExt.compileOptions {
                    sourceCompatibility JavaVersion.VERSION_17
                    targetCompatibility JavaVersion.VERSION_17
                }
            }
        }
        project.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
            kotlinOptions {
                jvmTarget = "17"
            }
        }
    }
}

subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.layout.buildDirectory
    delete file("../build")
}
